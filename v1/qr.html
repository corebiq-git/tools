<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>QR Maker | CorbiQ Tools</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header class="topbar"><a class="brand" href="index.html">Corbi<span class="q">Q</span> Tools</a><button class="icon-btn" onclick="showToast('Search is available from the dashboard')" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="7.4"/><path d="m16.5 16.5 5 5"/></svg></button><button class="icon-btn" onclick="location.reload()" aria-label="Refresh"><svg viewBox="0 0 24 24"><path d="M20 7v5h-5M4.7 9A8 8 0 0 1 18 5l2 2M4 17v-5h5M19.3 15A8 8 0 0 1 6 19l-2-2"/></svg></button><div class="avatar">Q</div></header><main class="content"><div class="page-head"><div class="eyebrow">Quick Utilities</div><h1>QR Maker</h1><p class="muted">Create a QR code from a website, text, UPI ID or other details.</p></div><section class="panel"><div class="field"><label for="qrText">Text or URL *</label><textarea id="qrText" placeholder="https://example.com or enter text to encode"></textarea></div><div class="form-grid"><div class="field"><label for="qrSize">QR size</label><select id="qrSize"><option value="180">180 × 180</option><option value="240" selected>240 × 240</option><option value="320">320 × 320</option><option value="400">400 × 400</option></select></div><div class="field"><label for="qrLabel">Optional label</label><input id="qrLabel" placeholder="e.g. Payment QR"></div></div><div class="button-row"><button class="btn btn-primary" id="makeQr">Generate QR</button><button class="btn btn-outline" id="downloadQr">Download PNG</button><button class="btn btn-light" id="clearQr">Clear</button></div><div class="qr-output" id="qrOutput"></div><div id="qrCaption" style="text-align:center;font-weight:600;margin-top:8px"></div><div class="result" id="qrMessage"></div><p class="footer-note">QR rendering uses the QRCode.js library from a CDN, so an internet connection is needed for generation.</p></section></main><nav class="bottom-nav" aria-label="Main navigation"><a class="nav-item " href="index.html"><span class="nav-icon"><svg class="home-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg></span><span>Home</span></a><a class="nav-item " href="gstr1.html"><span class="nav-icon"><svg class="" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2.5h8l5 5V21H6z"/><path d="M14 2.5V8h5M9 13h7M9 17h7"/></svg></span><span>GST</span></a><a class="nav-item active" href="calc.html"><span class="nav-icon"><svg class="" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="2.5" width="16" height="19" rx="2"/><path d="M7 6h10M8 11h2M14 11h2M8 15h2M14 15h2M8 18.5h2M14 18.5h2"/></svg></span><span>Utilities</span></a><a class="nav-item " href="invoice.html"><span class="nav-icon"><svg class="" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2.5h8l5 5V21H6z"/><path d="M14 2.5V8h5M9 13h7M9 17h5"/></svg></span><span>Invoices</span></a></nav><div class="toast" id="toast" role="status"></div><script>function showToast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove("show"),2400)}</script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>
const input=document.getElementById('qrText'),out=document.getElementById('qrOutput'),msg=document.getElementById('qrMessage');
document.getElementById('makeQr').onclick=()=>{const value=input.value.trim();out.innerHTML='';msg.textContent='';if(!value){msg.textContent='Please enter text or a URL first.';return}if(!window.QRCode){msg.textContent='QR library could not load. Check your internet connection.';return}new QRCode(out,{text:value,width:+document.getElementById('qrSize').value,height:+document.getElementById('qrSize').value,colorDark:'#111827',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});document.getElementById('qrCaption').textContent=document.getElementById('qrLabel').value.trim();};
document.getElementById('downloadQr').onclick=()=>{const canvas=out.querySelector('canvas');const img=out.querySelector('img');let url=canvas?canvas.toDataURL('image/png'):img?.src;if(!url){msg.textContent='Generate a QR code before downloading.';return}const a=document.createElement('a');a.href=url;a.download='corbiq-qr.png';a.click()};
document.getElementById('clearQr').onclick=()=>{input.value='';out.innerHTML='';msg.textContent='';document.getElementById('qrCaption').textContent=''};
</script></body></html>
