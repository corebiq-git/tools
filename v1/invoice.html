<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Invoice Generator | CorbiQ Tools</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header class="topbar"><a class="brand" href="index.html">Corbi<span class="q">Q</span> Tools</a><button class="icon-btn" onclick="showToast('Search is available from the dashboard')" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="7.4"/><path d="m16.5 16.5 5 5"/></svg></button><button class="icon-btn" onclick="location.reload()" aria-label="Refresh"><svg viewBox="0 0 24 24"><path d="M20 7v5h-5M4.7 9A8 8 0 0 1 18 5l2 2M4 17v-5h5M19.3 15A8 8 0 0 1 6 19l-2-2"/></svg></button><div class="avatar">Q</div></header><main class="content"><div class="page-head"><div class="eyebrow">Invoice & Documents</div><h1>Invoice Generator</h1><p class="muted">Create a simple invoice, calculate totals and print or save as PDF.</p></div><section class="panel"><h2>Invoice details</h2><div class="form-grid"><div class="field"><label for="invNo">Invoice number</label><input id="invNo" value="INV-00001"></div><div class="field"><label for="invDate">Invoice date</label><input id="invDate" type="date"></div><div class="field"><label for="business">Business name</label><input id="business" placeholder="Your business name"></div><div class="field"><label for="customer">Bill to</label><input id="customer" placeholder="Customer name"></div><div class="field"><label for="gstin">GSTIN (optional)</label><input id="gstin" placeholder="GSTIN"></div><div class="field"><label for="currency">Currency symbol</label><input id="currency" value="₹" maxlength="4"></div></div><h2 style="margin-top:12px">Item details</h2><div class="form-grid"><div class="field"><label for="item">Description</label><input id="item" value="Professional services"></div><div class="field"><label for="qty">Quantity</label><input id="qty" type="number" min="0" step="any" value="1"></div><div class="field"><label for="rate">Rate</label><input id="rate" type="number" min="0" step="any" value="1000"></div><div class="field"><label for="tax">GST rate (%)</label><select id="tax"><option value="0">0%</option><option value="5">5%</option><option value="12">12%</option><option value="18" selected>18%</option><option value="28">28%</option></select></div></div><div class="button-row"><button class="btn btn-primary" id="makeInvoice">Generate invoice</button><button class="btn btn-outline" onclick="window.print()">Print / Save PDF</button><button class="btn btn-light" id="resetInvoice">Reset</button></div></section><section class="panel" id="invoicePreview"><div class="section-head"><h2>Invoice preview</h2><span class="text-link">Draft</span></div><div id="invoiceBody" class="muted">Enter invoice details and select Generate invoice.</div></section></main><nav class="bottom-nav" aria-label="Main navigation"><a class="nav-item " href="index.html"><span class="nav-icon"><svg class="home-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg></span><span>Home</span></a><a class="nav-item " href="gstr1.html"><span class="nav-icon"><svg class="" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2.5h8l5 5V21H6z"/><path d="M14 2.5V8h5M9 13h7M9 17h7"/></svg></span><span>GST</span></a><a class="nav-item " href="calc.html"><span class="nav-icon"><svg class="" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="2.5" width="16" height="19" rx="2"/><path d="M7 6h10M8 11h2M14 11h2M8 15h2M14 15h2M8 18.5h2M14 18.5h2"/></svg></span><span>Utilities</span></a><a class="nav-item active" href="invoice.html"><span class="nav-icon"><svg class="" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2.5h8l5 5V21H6z"/><path d="M14 2.5V8h5M9 13h7M9 17h5"/></svg></span><span>Invoices</span></a></nav><div class="toast" id="toast" role="status"></div><script>function showToast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove("show"),2400)}</script><style>@media print{body{background:white;padding:0}.status,.topbar,.bottom-nav,.page-head,.panel:first-of-type,.toast{display:none!important}.app{box-shadow:none;max-width:none}.content{padding:0}#invoicePreview{border:0;box-shadow:none}}</style><script>
const el=id=>document.getElementById(id);el('invDate').value=new Date().toISOString().slice(0,10);
function money(n){return (el('currency').value||'₹')+Number(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function makeInvoice(){const qty=Math.max(0,Number(el('qty').value)||0),rate=Math.max(0,Number(el('rate').value)||0),base=qty*rate,tax=base*(Number(el('tax').value)||0)/100,total=base+tax;const date=el('invDate').value;el('invoiceBody').innerHTML=`<div style="display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;margin-bottom:25px"><div><div style="font-size:25px;font-weight:700;color:#17191f">${esc(el('business').value||'Your Business')}</div><div class="muted">GSTIN: ${esc(el('gstin').value||'—')}</div></div><div style="text-align:right"><div style="font-size:23px;font-weight:700;color:#0969da">INVOICE</div><div>${esc(el('invNo').value)}</div><div>${esc(date||'')}</div></div></div><div style="margin:18px 0"><strong>Bill to</strong><div>${esc(el('customer').value||'Customer')}</div></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Description</th><th>Qty</th><th>Rate</th><th>Amount</th></tr></thead><tbody><tr><td>${esc(el('item').value||'Item')}</td><td>${qty}</td><td>${money(rate)}</td><td>${money(base)}</td></tr></tbody></table></div><div style="max-width:300px;margin:20px 0 0 auto"><div style="display:flex;justify-content:space-between;padding:7px 0"><span>Subtotal</span><strong>${money(base)}</strong></div><div style="display:flex;justify-content:space-between;padding:7px 0"><span>GST (${Number(el('tax').value)||0}%)</span><strong>${money(tax)}</strong></div><div style="display:flex;justify-content:space-between;padding:12px 0;border-top:2px solid #222;font-size:20px"><strong>Total</strong><strong>${money(total)}</strong></div></div><p class="footer-note">This is a generated invoice draft. Verify all details and applicable tax treatment before issuing.</p>`}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
el('makeInvoice').onclick=makeInvoice;el('resetInvoice').onclick=()=>{['business','customer','gstin'].forEach(k=>el(k).value='');el('item').value='Professional services';el('qty').value=1;el('rate').value=1000;el('tax').value='18';makeInvoice()};makeInvoice();
</script></body></html>
