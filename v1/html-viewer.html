true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg></span><span>Home</span></a><a class="nav-item " href="gstr1.html"><span class="nav-icon"><svg class="" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2.5h8l5 5V21H6z"/><path d="M14 2.5V8h5M9 13h7M9 17h7"/></svg></span><span>GST</span></a><a class="nav-item active" href="calc.html"><span class="nav-icon"><svg class="" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="2.5" width="16" height="19" rx="2"/><path d="M7 6h10M8 11h2M14 11h2M8 15h2M14 15h2M8 18.5h2M14 18.5h2"/></svg></span><span>Utilities</span></a><a class="nav-item " href="invoice.html"><span class="nav-icon"><svg class="" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2.5h8l5 5V21H6z"/><path d="M14 2.5V8h5M9 13h7M9 17h5"/></svg></span><span>Invoices</span></a></nav><div class="toast" id="toast" role="status"></div><script>function showToast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove("show"),2400)}</script><script>

document.getElementById('clearBtn').onclick=()=>{code.value='';frame.srcdoc=''};
</script></body></html>
